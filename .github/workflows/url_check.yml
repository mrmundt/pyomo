name: URL Validation

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Hash (Optional)
        required: false

jobs:
  url_check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Pyomo source
      uses: actions/checkout@v6
    - name: URL Checker
      uses: lycheeverse/lychee-action@v2
      with:
        # Check URLs in Markdown, reStructuredText, and Python source files.
        # Exclusions, retries, timeouts, and accepted status codes are
        # configured in lychee.toml.
        args: >-
          --config ./.github/workflows/lychee.toml
          --verbose
          --no-progress
          './**/*.md'
          './**/*.rst'
          './**/*.py'
        # Fail the job (non-zero exit) when broken links are found.
        fail: true
